name: CI

on:
  push:
    branches: [main]
  pull_request:

# A second push to the same branch makes the first run irrelevant. Cancelling
# it keeps the queue short without hiding anything: main is excluded, so no
# push to the default branch ever goes unverified.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

defaults:
  run:
    # Not the default shell. GitHub's is `bash -e {0}`, which has no pipefail,
    # so `pnpm install | tail` reports the exit code of `tail` -- always zero --
    # and a failed install reads as a green step. `shell: bash` is
    # `bash --noprofile --norc -eo pipefail {0}`, which fails on the real
    # command. Nothing below pipes a build step anyway; this is the backstop.
    shell: bash

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pnpm-install

      # ripgrep is a runtime dependency, not a convenience: the Search port
      # shells out to it, and the runtime image installs it for the same reason.
      # GitHub's ubuntu image does not ship it, so without this the search
      # adapter's tests all fail with SearchUnavailableError -- correctly, which
      # is the point. CI has to look like production or it tests something else.
      #
      # The full set the server shells out to is `requiredBinaries` in
      # packages/server/src/preflight.ts, matched by the apt-get in
      # deploy/Dockerfile. Only ripgrep is installed here: git is already on the
      # runner, and nvim is not exercised by any test -- the terminal tests
      # spawn /bin/sh. Add it here if that ever changes.
      - name: Install ripgrep
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ripgrep
          rg --version | head -1

      # Needs no install, so it runs before one. Four source files in this
      # repository have carried a literal NUL byte, which makes git classify
      # them as binary and stop showing diffs entirely -- the code works, the
      # tests pass, and every later change to that file becomes invisible in
      # review. Cheap to check, expensive to notice by eye.
      - name: Check for NUL bytes in source
        run: ./scripts/check-source-bytes.sh

      # typecheck, lint, format:check, test -- see the root package.json. One
      # script so that CI and `pnpm verify` on a laptop cannot drift apart.
      - name: Verify
        run: pnpm verify

  # The pty delivery assertions, quarantined.
  #
  # They fail on this runner with a shortfall that moves between runs, for a
  # reason nothing in this repository can fix -- see pty-delivery-gate.ts, which
  # is also what skips them in `verify`. Left in `verify` they made 15 of 25
  # runs red, and since deploy/auto-deploy.sh refuses a commit whose checks are
  # not green, they were blocking real deploys to re-report a known fault.
  #
  # `(advisory)` in the name is load-bearing: auto-deploy.sh ignores any check
  # whose name ends with it. Rename this and deploys start gating on it again.
  #
  # `continue-on-error` keeps the run itself green so the repository stops
  # crying wolf; the two together mean neither GitHub's red X nor the deploy
  # gate depends on which way this resolves.
  pty-delivery:
    name: pty delivery (advisory)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true

    steps:
      - uses: actions/checkout@v5

      - uses: ./.github/actions/pnpm-install

      # The env var is what un-skips them; see pty-delivery-gate.ts.
      - name: Pty delivery
        env:
          PTY_DELIVERY_TESTS: '1'
        run: |
          pnpm --filter @vim-notes/server exec vitest run \
            src/adapters/pty-truncation-diagnostic.test.ts \
            src/adapters/node-pty-terminal-host.test.ts

  # Replaces the post-receive hook job, which went with the hub (DECISIONS §2).
  #
  # Kept for the same reason that one earned its place: it touches no registry,
  # so it still reports on a day when npm is down -- which is exactly when you
  # want to know the deploy path is intact. It also closes a gap that was open
  # the whole time the hub existed: the compose file had never been checked by
  # the real tool, only parsed as YAML, because the compose plugin was not
  # installed on the machine it was written on.
  deploy-config:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v5

      # auto-deploy.sh runs unattended on a timer where nobody sees its output,
      # so a syntax error there is a deploy that silently stops happening.
      - name: Shell scripts parse
        run: |
          bash -n deploy/bootstrap.sh
          bash -n deploy/auto-deploy.sh

      # Copying the example into place is the point, not a workaround: the
      # compose file fails on any `${VAR:?}` it cannot resolve, so this asserts
      # that .env.example actually contains every variable a deployment needs.
      # A new required setting that nobody documented fails here.
      - name: Compose file resolves against .env.example
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config >/dev/null

      # The one line that decides who can reach a WebSocket onto a real shell.
      # Cheap to assert, catastrophic to get wrong, and easy to break by
      # accident while editing something unrelated nearby.
      - name: Server publishes no ports and Caddy binds one address
        run: |
          cp deploy/.env.example deploy/.env
          docker compose -f deploy/docker-compose.yml config --format json \
            | python3 -c '
          import json, sys
          services = json.load(sys.stdin)["services"]
          if services["server"].get("ports"):
              sys.exit("server publishes ports; it must only be reachable on the compose network")
          published = [p.get("host_ip") for p in services["caddy"].get("ports", [])]
          if not published:
              sys.exit("caddy publishes nothing, so the stack is unreachable")
          if any(ip in (None, "", "0.0.0.0", "::") for ip in published):
              sys.exit(f"caddy is bound to every interface ({published}); it must bind one address")
          print(f"ok: server unpublished, caddy bound to {published}")
          '
