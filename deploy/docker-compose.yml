name: vim-notes

# Two services and no published port on the one that matters. See DECISIONS §11:
# this stack contains a real shell reachable over a WebSocket, so the access
# control is "it is not on the internet" rather than a login form.

services:
  server:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: server
    restart: unless-stopped

    # Reaps the processes nvim leaves behind. Without an init, every abandoned
    # pty child becomes a zombie held by pid 1.
    init: true

    # The auto-committer flushes its pending commit on shutdown -- that flush is
    # what stops the last thing you typed from being lost on a redeploy. Give it
    # room to finish rather than the default ten seconds.
    stop_grace_period: 30s

    # Runs as you, not as root. The notes directory is a bind mount from the
    # host and you will want to work in it directly -- `git` refuses to operate
    # on a repository owned by someone else, and the deploy key mounted below
    # has to be readable by whoever this process turns out to be.
    #   DOCKER_USER="$(id -u):$(id -g)" in .env
    user: ${DOCKER_USER:?set DOCKER_USER in .env, e.g. "$(id -u):$(id -g)"}

    environment:
      # Mounted at the same path it has on the host -- see the volumes below.
      NOTES_ROOT: ${NOTES_DIR:?set NOTES_DIR in .env}

      # Binds every interface *inside the container*. That is not the loosening
      # it looks like: this service publishes no ports at all, so the only thing
      # that can reach 4321 is another container on this compose network, which
      # is Caddy. The host-facing bind is the one on the caddy service below.
      HOST: 0.0.0.0
      PORT: 4321

      GIT_REMOTE: origin
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-vim-notes}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-vim-notes@localhost}

      # Only so preflight can notice `origin` disagreeing with it. The server
      # pushes to whatever the clone already points at.
      GIT_REMOTE_URL: ${GIT_REMOTE_URL:?set GIT_REMOTE_URL in .env}

      # Read-only mount, below. Never copied into the image.
      GIT_SSH_KEY_PATH: /run/secrets/notes-deploy-key
      # ssh has nowhere to record host keys otherwise: the container runs as a
      # host uid with no home directory of its own.
      GIT_KNOWN_HOSTS_PATH: /state/known_hosts

      # How often to pull and push. This is what replaced the hub's
      # post-receive hook: the server is tailnet-only, so GitHub cannot call us
      # and we have to ask. 0 disables polling.
      SYNC_INTERVAL_MS: ${SYNC_INTERVAL_MS:-60000}

      # Set WATCH_POLLING=true in .env when NOTES_DIR is a bind mount from a
      # macOS or Windows host, or a network filesystem. Native recursive
      # watching drops events on all of those and fails silently -- the watcher
      # looks healthy and the browser simply stops seeing what nvim writes.
      WATCH_POLLING: ${WATCH_POLLING:-false}
      WATCH_POLL_INTERVAL_MS: ${WATCH_POLL_INTERVAL_MS:-100}

      # A login shell, not an editor -- DECISIONS §3. `-l` so it reads
      # /etc/profile and ~/.profile, like a shell opened over ssh would.
      TERMINAL_COMMAND: bash
      TERMINAL_ARGS: -l
      NODE_ENV: production

    volumes:
      # Host path == container path. Not load-bearing any more now that the
      # remote is a URL rather than a path on disk, but kept because it makes
      # every path in a log or a stack trace mean the same thing on both sides.
      - ${NOTES_DIR}:${NOTES_DIR}

      # The deploy key. Read-only, and a file rather than an environment
      # variable so it cannot show up in `docker inspect` or a crash dump.
      - ${GIT_SSH_KEY_PATH:?set GIT_SSH_KEY_PATH in .env}:/run/secrets/notes-deploy-key:ro

      # Your init.lua and plugins. Read-only: the editor may load from here, it
      # may not rewrite your config, and a plugin manager writing into a mount
      # marked ro fails loudly instead of half-succeeding.
      - ${NVIM_CONFIG_DIR:-./nvim-config}:/config/nvim:ro

      # Plugin installs, shada, undo history. Named rather than bound because
      # none of it is worth backing up and all of it is regenerable.
      - nvim-state:/state

  # The news aggregator, as a read-only source the notes server queries.
  #
  # Its own repository (github.com/CharbelDaher8/news-aggregator), checked out
  # beside this one and built from there rather than pulled from a registry --
  # one fewer moving part, and auto-deploy.sh updates both checkouts together.
  #
  # No published port and no host binding: only the notes server talks to it,
  # over this compose network. That is the whole access control, because the API
  # has no authentication of its own (see agg/api.py). It must never gain a
  # `ports:` entry.
  #
  # Optional in the sense that matters: if this service is absent or down, the
  # notes server reports the news pane as unavailable and everything else works.
  news:
    # Behind a profile, which is what keeps this optional in the way that
    # matters: without it, a box that has no news checkout cannot build this
    # service, `docker compose up --build` fails, and the *notes* stop
    # deploying. A missing side feature must not be able to do that.
    #
    # auto-deploy.sh passes --profile news only when the checkout is present,
    # so the failure mode is "no news pane" rather than "no deploys".
    profiles: ['news']

    build:
      context: ${NEWS_REPO_DIR:-../../news-aggregator}
    restart: unless-stopped
    init: true

    environment:
      # Only `refresh` uses this; the API serves what is already stored, so an
      # expired token degrades to "no new items" rather than to a broken pane.
      #
      # Deliberately read from the environment rather than baked into the image:
      # a token in a layer is a token in every copy of that image.
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN:-}

    volumes:
      # items.db, and the read/saved state in it. The one thing here worth
      # keeping, so it is a named volume rather than a container layer.
      - news-data:/app/data

  caddy:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: caddy
    restart: unless-stopped
    depends_on:
      - server

    ports:
      # The single line that decides who can reach this. BIND_ADDR must be the
      # host's tailnet address, so the listener exists only on the WireGuard
      # interface -- not on the LAN, not on a public IP. It defaults to loopback
      # so that a missing .env fails closed rather than open.
      #
      # This is also the seam for the public endpoint mentioned in DECISIONS §11:
      # exposing this properly means changing BIND_ADDR to 0.0.0.0 *and* adding
      # a site block with `tls` plus an auth handler in the Caddyfile. Both, and
      # never the first on its own -- the terminal is a shell.
      - '${BIND_ADDR:-127.0.0.1}:${BIND_PORT:-8080}:80'

    volumes:
      # Bind-mounted rather than baked in so proxy rules can be changed with a
      # `docker compose restart caddy` instead of an image rebuild.
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  nvim-state:
  news-data:
  caddy-data:
  caddy-config:
